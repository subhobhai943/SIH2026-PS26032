name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Dependencies
        working-directory: ./server
        run: npm install

      - name: Validate Syntax & Routes
        working-directory: ./server
        run: |
          node -c src/index.js
          node -c src/app.js
          node -c src/controllers/shipmentController.js
          node -c src/routes/shipmentRoutes.js
          node -c src/models/Shipment.js

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://51.20.193.239:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Dependencies
        working-directory: ./client
        run: npm install

      - name: Next.js Build (Typecheck & Lint)
        working-directory: ./client
        run: npm run build
