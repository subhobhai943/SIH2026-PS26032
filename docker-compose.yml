version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/sih26032
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OTP_DEV_MODE: "true"
      SMS_PROVIDER: console

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

volumes:
  mongo_data:
