# ==============================================================================
# SIH 2026 PS26032 — High Availability Nginx Reverse Proxy & Load Balancer
# ==============================================================================
# Upstream load balancing cluster pointing to Node.js / PM2 backend workers
upstream sih_backend_cluster {
    # Load balancing method: least_conn directs traffic to the least busy worker
    least_conn;

    # Backend Node.js cluster processes
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    # (Optional secondary backend instances if running on multiple ports)
    # server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

# Rate limit zone: 50 requests/sec per IP with a burst capacity of 100
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Client upload size (support crop lot photos & camera captures up to 15MB)
    client_max_body_size 15M;

    # Gzip Compression for fast mobile response
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Real Client IP forwarding through AWS ALB / Cloudflare / Reverse Proxies
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_http_version 1.1;

    # Health check endpoint for AWS ALB / ELB
    location /health {
        proxy_pass http://sih_backend_cluster/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # API Routes with rate limiting and connection pooling
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://sih_backend_cluster;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Standard caching bypass for dynamic API
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # WebSocket / Socket.io live queue proxying
    location /socket.io/ {
        proxy_pass http://sih_backend_cluster/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static media uploads
    location /uploads/ {
        alias /home/ubuntu/SIH2026-PS26032/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
